<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />

      property="og:description"
      content="Free public AI chat. No login, no signup, no subscription. Ad-funded, so it stays free."

    <meta property="og:url" content="https://chat.kiwicraft.in/" />
    <meta property="og:image" content="/favicon.svg" />

    <meta name="twitter:card" content="summary" />

      name="twitter:description"
      content="Free public AI chat. No login, no signup, no subscription."
    />
    <link rel="canonical" href="https://chat.kiwicraft.in/" />
    <title>Web AI — Free Chat</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Web AI",

        "logo": "/favicon.svg",
